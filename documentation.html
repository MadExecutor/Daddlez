<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documentation - Daddlez</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <style>
      /* Styles for Documentation form page */
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(to bottom right, #1a1a1a, #000000);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }

      .form-container {
        width: 90%;
        max-width: 400px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        padding: 2rem;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
      }

      .form-container h1 {
        font-size: 2rem;
        text-align: center;
        color: #fff;
        margin-bottom: 1.5rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-group label {
        display: block;
        font-size: 1rem;
        margin-bottom: 0.5rem;
        color: #fff;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 1px solid #7f42a7;
        border-radius: 50px;
        background-color: rgba(255, 255, 255, 0.05);
        color: #fff;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.3s ease;
      }

      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        border-color: #5300a0;
      }

      .form-group textarea {
        resize: none;
        border-radius: 15px;
      }

      .btn-submit {
        display: block;
        width: 100%;
        padding: 1rem;
        border: none;
        border-radius: 50px;
        background: linear-gradient(to right, #7f42a7, #5300a0);
        color: #fff;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        text-align: center;
        transition: background 0.3s ease, transform 0.2s ease;
      }

      .btn-submit:hover {
        background: linear-gradient(to right, #5300a0, #7f42a7);
        transform: scale(1.05);
      }
      /* Ensure the footer sticks at the bottom and does not overlap content */
html, body {
  height: 100%; /* Make the html and body take the full height of the viewport */
  margin: 0; /* Remove default margin */
  display: flex;
  flex-direction: column;
}

body {
  display: flex;
  flex-direction: column;
}

main {
  flex: 1; /* This makes the main content take the available space, pushing the footer down */
  display: flex;
  justify-content: center;
  align-items: center;
}

footer {
  background-color: #000;
  color: #fff;
  padding: 2rem 1rem;
  font-family: Arial, sans-serif;
  text-align: center;
  width: 100%;
  position: relative; /* Prevent overlapping */
}
    </style>
  </head>
  <body>
    <div class="form-container">
      <h1>Say Hello!</h1>
      <form>
        <div class="form-group">
          <label for="name">Your Name:</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required />
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="Enter your email address" required />
        </div>
        <div class="form-group">
          <label for="services">Needed Services:</label>
          <select id="services" name="services" required>
            <option value="">Choose Services</option>
            <option value="api">API Integration</option>
            <option value="documentation">Documentation Review</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="budget">Budget:</label>
          <select id="budget" name="budget" required>
            <option value="">Select Budget</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="4" placeholder="Your message here..." required></textarea>
        </div>
        <button type="submit" class="btn-submit">Submit</button>
      </form>
    </div>
    <footer>
        <div class="footer-container">
          <div class="footer-logo">
            <h2>Daddlez</h2>
            <p>No need to search more !</p>
          </div>
          <div class="footer-links">
            <ul>
              <li><strong>WEEBLY THEMES</strong></li>
              <li><a href="#">Pre-Sale FAQs</a></li>
              <li><a href="#">Submit a Ticket</a></li>
            </ul>
            <ul>
              <li><strong>SERVICES</strong></li>
              <li><a href="#">Theme Tweak</a></li>
            </ul>
            <ul>
              <li><strong>SHOWCASE</strong></li>
              <li><a href="#">Widgetkit</a></li>
              <li><a href="#">Support</a></li>
            </ul>
            <ul>
              <li><strong>ABOUT US</strong></li>
              <li><a href="#">Contact Us</a></li>
              <li><a href="#">Affiliates</a></li>
              <li><a href="#">Resources</a></li>
            </ul>
          </div>
          <div class="footer-social">
            <a href="#"><i class="fa fa-facebook"></i></a>
            <a href="#"><i class="fa fa-twitter"></i></a>
            <a href="#"><i class="fa fa-rss"></i></a>
            <a href="#"><i class="fa fa-google"></i></a>
            <a href="#"><i class="fa fa-flickr"></i></a>
          </div>
          <div class="footer-copyright">
            <p>&copy; Copyright. All rights reserved.</p>
          </div>
        </div>
      </footer>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
  </body>
</html>
